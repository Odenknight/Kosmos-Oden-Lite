name: Browser

# Real-browser rendering gate (CI/CD directive §7.4) — the assessment's largest
# assurance gap. Boots the built WebGL2 artifact in Chromium via Playwright and
# asserts the r185 renderer initializes, draws the scene, survives a context
# loss/restore cycle, and renders under the plugin's iframe sandbox.
#
# WHY CHROMIUM ONLY HERE (signal integrity): GitHub-hosted runners have no GPU.
# Chromium can be driven onto ANGLE/SwiftShader — a conformant *software* WebGL2
# implementation that this renderer accepts — so this job is a genuine,
# reliably-passing gate. Firefox and WebKit have no dependable software-WebGL2
# path on headless Linux, so they run in the advisory `Browser (full matrix)`
# workflow (workflow_dispatch + weekly schedule) instead of being wired here as
# a permanently-red required check. A check that is always red trains people to
# merge through red and hides real regressions; nothing has been deleted or
# skipped — see CONTRIBUTING.md "Browser and visual tests".

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "test/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-chromium:
    name: browser-chromium (software WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build artifacts (needed by the browser tests)
        run: npm run build
      # Playwright is an optional QA dependency; install it here rather than
      # pinning it into the offline runtime bundle.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --save-exact @playwright/test@1.48.2
          npx playwright install --with-deps chromium
      - name: Browser smoke tests (Chromium / SwiftShader)
        run: npm run test:browser:chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
